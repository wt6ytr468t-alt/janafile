<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Paracetamol Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Paracetamol Calculator</h1>
            <p>Pediatric Dosage Calculator</p>
            <p>By Jana Alshanbari</p>
        </div>

        <div class="calculator">

            <label for="age">Age (years)</label>
            <input
                type="number"
                id="age"
                placeholder="Enter age in years"
                min="0"
                max="17"
                step="0.1"
            >

            <label for="weight">Weight (kg)</label>
            <input
                type="number"
                id="weight"
                placeholder="Enter weight in kg"
                min="0.1"
                step="0.1"
            >

            <label for="concentration">Medicine concentration</label>

            <select id="concentration">
                <option value="120">120 mg / 5 mL</option>
                <option value="160">160 mg / 5 mL</option>
                <option value="250">250 mg / 5 mL</option>
            </select>

            <button onclick="calculateDose()">
                Calculate
            </button>

            <div id="result" class="result hidden"></div>

            <div class="warning">
                <strong>Safety notice</strong>
                <p>
                    Educational prototype only. This calculator
                    does not replace a physician or pharmacist.
                    Verify the medicine concentration and dose
                    with a healthcare professional before use.
                </p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
